version: "3.8"

services:
  nginx:
    build:
      context: ./nginx
    container_name: "nginx_cont"
    networks:
      - notes-app
    ports:
      - "80:80"
    restart: always
    depends_on:
      - django
  db:
    container_name: "db_cont"
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - notes-app
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


  django:
    # build:
      context: .
    container_name: "django_cont"
    image: "priyanshp123/notes-app"
    command: sh -c "python manage.py migrate --no-input && gunicorn notesapp.wsgi --bind 0.0.0.0:8000 "
    networks:
      - notes-app
    ports:
      - "8000:8000"
    env_file:
      - ".env"
    restart: always
    depends_on:
      - db


    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s



networks:
  notes-app:
